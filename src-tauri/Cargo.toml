[package]
name = "exfil-v2"
version = "2.5.1"
description = "EXFIL — per-game color/gamma/vibrance preset tool"
authors = ["Blazzer"]
license = "MIT"
edition = "2021"

[lib]
name = "exfil_v2_lib"
# rlib only: desktop-only app (no mobile target). The template's staticlib +
# cdylib made every debug build emit and link two extra ~0.9 GB artifacts.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

# Windows display + NVAPI FFI. GDI gamma ramps via the `windows` crate;
# NVAPI digital vibrance via raw nvapi64.dll QueryInterface (no DLL injection —
# all writes go through the display driver, BattlEye/EAC-safe).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_ColorSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
libloading = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Iteration build: no fat LTO, 16 codegen units, incremental. Ship builds keep
# [profile.release]. Use: npx @tauri-apps/cli build --no-bundle -- --profile release-fast
# -> C:\cargo-targets\release-fast\exfil-v2.exe
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Dev-loop speed: line tables only for own code, no debuginfo for dependencies
# (smaller PDBs, faster link). `cargo test` inherits this profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
